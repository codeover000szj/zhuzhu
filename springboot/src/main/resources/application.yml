spring:
  config:
    # Optional machine-local secrets; keep outside resources so they are not packaged into the application jar.
    import: "optional:file:./application-local.yml,optional:file:./springboot/application-local.yml"
  application:
    name: springboot
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/heritage_db?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:}"
  
  # 安全配置
  security:
    user:
      name: admin
      password: ${SPRING_SECURITY_USER_PASSWORD}
  main:
    allow-bean-definition-overriding: true
  # 邮件配置
  mail:
    host: smtp.qq.com
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    default-encoding: utf-8
    port: 587
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
            protocols: TLSv1.2
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
  
  # Web配置
  mvc:
    static-path-pattern: /**  # 允许根路径访问静态资源
  web:
    resources:
      static-locations: classpath:/static/, file:./files/  # 添加files目录
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  
  # JSON配置
  jackson:
    default-property-inclusion: non_empty
  
  # Spring AI配置
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:local-unconfigured-key}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          temperature: 0.7
        completions-path: /v1/chat/completions

# 服务器配置
server:
  port: 8889
  servlet:
    context-path: /

# Payment provider credentials and signed callbacks are not configured in this project.
# The local launcher opts into an explicitly labeled, no-charge demo flow; other runs default off.
heritage:
  payment:
    demo-enabled: ${HERITAGE_PAYMENT_DEMO_ENABLED:false}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  enable-spring-security: false
  paths-to-match: /**
  packages-to-scan: org.example.springboot

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  basic:
    enable: true
    username: admin
    password: ${KNIFE4J_BASIC_PASSWORD}

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀


# 文件管理配置
file:
  upload:
    path: ./files
    maxSize: 524288000  # 500MB (500 * 1024 * 1024)
