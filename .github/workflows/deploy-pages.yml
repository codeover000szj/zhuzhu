name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'vue3/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vue3/package-lock.json
      - run: npm ci
        working-directory: vue3
      - run: npm run build
        working-directory: vue3
        env:
          GITHUB_ACTIONS: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vue3/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
